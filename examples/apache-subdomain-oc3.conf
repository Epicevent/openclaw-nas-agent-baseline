# Subdomain VirtualHost - oc3 (port 28989)
# Server: /etc/apache2/sites-available/oc3.ji-tech.co.kr.conf -> a2ensite -> reload
# DNS: oc3.ji-tech.co.kr -> server IP, or a wildcard ji-tech.co.kr A record
# OpenClaw: OPENCLAW_PROXY_MODE=subdomain
#           OPENCLAW_PROXY_PUBLIC_ORIGIN=https://oc3.ji-tech.co.kr
#           OPENCLAW_CONTROL_UI_BASEPATH=/

<VirtualHost *:443>
    ServerName oc3.ji-tech.co.kr

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/ji-tech.co.kr/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/ji-tech.co.kr/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 3600

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} .*upgrade.* [NC]
    RewriteRule ^/(.*)$ ws://127.0.0.1:28989/$1 [P,L]

    <Location />
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Host expr=%{HTTP_HOST}
    </Location>

    ProxyPass        / http://127.0.0.1:28989/ retry=0 timeout=3600
    ProxyPassReverse / http://127.0.0.1:28989/
</VirtualHost>
