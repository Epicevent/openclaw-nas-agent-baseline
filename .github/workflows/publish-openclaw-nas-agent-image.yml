name: Publish OpenClaw Family Runtime Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Public GHCR tag to publish
        required: true
        default: openclaw-source-20260605-r10
      base_image:
        description: Frozen runtime image digest to wrap, for example ghcr.io/epicevent/openclaw-nas-agent@sha256:...
        required: true
      openclaw_source_repo:
        description: OpenClaw source repository to build Control UI from
        required: true
        default: https://github.com/Epicevent/openclaw-jitech.git
      openclaw_source_ref:
        description: Exact OpenClaw source commit SHA to build
        required: true
      expected_login_title:
        description: Optional visible login title expected in the built Control UI
        required: false
        default: ""
      runtime_user:
        description: User inside the runtime image
        required: true
        default: node

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/epicevent/openclaw-nas-agent

jobs:
  publish:
    name: Build and push ${{ inputs.image_tag }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout baseline repo
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.image_tag }}" =~ ^openclaw-[A-Za-z0-9._-]+$ ]]
          [[ "${{ inputs.base_image }}" =~ ^[A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "${{ inputs.base_image }}" != "ghcr.io/openclaw/openclaw:latest" ]]
          [[ "${{ inputs.openclaw_source_repo }}" =~ ^https://github.com/[-A-Za-z0-9_.]+/[-A-Za-z0-9_.]+[.]git$ ]]
          [[ "${{ inputs.openclaw_source_repo }}" != "https://github.com/openclaw/openclaw.git" ]]
          [[ "${{ inputs.openclaw_source_ref }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.runtime_user }}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]

      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build OpenClaw family runtime image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          docker build \
            --build-arg BASE_IMAGE="${{ inputs.base_image }}" \
            --build-arg RUNTIME_USER="${{ inputs.runtime_user }}" \
            --build-arg OPENCLAW_SOURCE_REPO="${{ inputs.openclaw_source_repo }}" \
            --build-arg OPENCLAW_SOURCE_REF="${{ inputs.openclaw_source_ref }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.base.name=${{ inputs.base_image }}" \
            --label "org.opencontainers.image.openclaw.source=${{ inputs.openclaw_source_repo }}" \
            --label "org.opencontainers.image.openclaw.revision=${{ inputs.openclaw_source_ref }}" \
            --label "org.opencontainers.image.title=JiTech OpenClaw-family runtime ${{ inputs.image_tag }}" \
            --label "org.opencontainers.image.description=OpenClaw-family runtime built from managed source with NAS document tools" \
            -t "$image_ref" \
            -f images/openclaw-nas-agent/Dockerfile .

      - name: Verify image source and optional Control UI branding
        shell: bash
        env:
          EXPECTED_LOGIN_TITLE: ${{ inputs.expected_login_title }}
          OPENCLAW_SOURCE_REPO: ${{ inputs.openclaw_source_repo }}
          OPENCLAW_SOURCE_REF: ${{ inputs.openclaw_source_ref }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          cid="$(docker create "$image_ref")"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          tmp="$(mktemp -d)"
          docker cp "$cid:/usr/local/share/openclaw-nas-agent-source.manifest" "$tmp/source.manifest"
          grep -Fx "family=openclaw" "$tmp/source.manifest"
          grep -Fx "source_repo=$OPENCLAW_SOURCE_REPO" "$tmp/source.manifest"
          grep -Fx "source_ref=$OPENCLAW_SOURCE_REF" "$tmp/source.manifest"
          grep -Fx "base_image=$BASE_IMAGE" "$tmp/source.manifest"
          docker cp "$cid:/app/dist/control-ui" "$tmp/control-ui"
          test -f "$tmp/control-ui/index.html"
          test -d "$tmp/control-ui/assets"
          if [[ -n "$EXPECTED_LOGIN_TITLE" ]]; then
            js_file="$(find "$tmp/control-ui/assets" -maxdepth 1 -type f -name 'index-*.js' | head -n 1)"
            test -n "$js_file"
            grep -F "$EXPECTED_LOGIN_TITLE" "$js_file"
            ! grep -F '<div class="login-gate__title">OpenClaw</div>' "$js_file"
            ! grep -F 'alt="OpenClaw"' "$js_file"
          fi

      - name: Check final image for baked secrets
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          docker image inspect "$image_ref" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Eiv '^(PATH|NODE_|PNPM_|NPM_|LANG|LANGUAGE|LC_ALL|HOME|YARN_|COREPACK_|OPENCLAW_|UV_|VIRTUAL_ENV|PYTHONPATH|PIP_|PLAYWRIGHT_)=' \
            | grep -Ei '(api[_-]?key|token|password|passwd|credential|secret)' && {
              echo "Secret-looking env key found in final image" >&2
              exit 1
            } || true

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          docker push "$image_ref"

      - name: Show pushed image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          docker image inspect "$image_ref" \
            --format 'image_ref='"$image_ref"' image_id={{.Id}} repo_digests={{json .RepoDigests}} os={{.Os}} arch={{.Architecture}}'
