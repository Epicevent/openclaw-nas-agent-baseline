name: Publish Hermes Family Runtime Wrapper

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Public GHCR tag to publish
        required: true
        default: hermes-wrapper-20260605-r1
      base_image:
        description: Already-built Hermes-family runtime image digest to wrap
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/epicevent/openclaw-nas-agent

jobs:
  publish:
    name: Wrap and push ${{ inputs.image_tag }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout operations repo
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.image_tag }}" =~ ^hermes-[A-Za-z0-9._-]+$ ]]
          [[ "${{ inputs.base_image }}" =~ ^[A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$ ]]

      - name: Log in to GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Hermes family runtime wrapper
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          docker build \
            --build-arg BASE_IMAGE="${{ inputs.base_image }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.family=hermes" \
            --label "org.opencontainers.image.base.name=${{ inputs.base_image }}" \
            --label "org.opencontainers.image.title=JiTech Hermes-family runtime wrapper ${{ inputs.image_tag }}" \
            --label "org.opencontainers.image.description=Hermes-family runtime image wrapped with NAS document tools" \
            -t "$image_ref" \
            -f images/hermes-workspace/Dockerfile .

      - name: Verify wrapped runtime
        shell: bash
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          cid="$(docker create "$image_ref")"
          cleanup() { docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          tmp="$(mktemp -d)"
          docker cp "$cid:/usr/local/share/agent-runtime-wrapper.manifest" "$tmp/wrapper.manifest"
          grep -Fx "family=hermes" "$tmp/wrapper.manifest"
          grep -Fx "base_image=$BASE_IMAGE" "$tmp/wrapper.manifest"
          docker cp "$cid:/opt/hermes-workspace/server-entry.js" "$tmp/server-entry.js"
          test -s "$tmp/server-entry.js"

      - name: Check final image for baked secrets
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          docker image inspect "$image_ref" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Eiv '^(PATH|NODE_|PNPM_|NPM_|LANG|LANGUAGE|LC_ALL|HOME|YARN_|COREPACK_|OPENCLAW_|HERMES_|UV_|VIRTUAL_ENV|PYTHONPATH|PIP_|PLAYWRIGHT_)=' \
            | grep -Ei '(api[_-]?key|token|password|passwd|credential|secret)' && {
              echo "Secret-looking env key found in final image" >&2
              exit 1
            } || true

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          docker push "$image_ref"

      - name: Show pushed image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_REPOSITORY:${{ inputs.image_tag }}"
          docker image inspect "$image_ref" \
            --format 'image_ref='"$image_ref"' image_id={{.Id}} repo_digests={{json .RepoDigests}} os={{.Os}} arch={{.Architecture}}'
