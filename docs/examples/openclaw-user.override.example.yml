# Example only. Merge the same ideas into the compose file that actually runs
# each OpenClaw account container.
#
# Required pieces for a containerized OpenClaw account:
#   1. image built from images/openclaw-nas-agent/Dockerfile
#   2. user-specific NAS bind mount
#   3. user-specific OpenClaw home/workspace bind mount
#
# Replace service name, image name, UID/GID, and host paths for each account.

services:
  openclaw-oc14:
    image: openclaw-nas-agent:baseline
    user: "1020:1020"
    environment:
      HOME: /home/oc14
    volumes:
      - /home/oc14/.openclaw:/home/oc14/.openclaw
      - /home/oc14/nas_docs:/home/oc14/nas_docs:ro
    working_dir: /home/oc14
